
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Login</title>
<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #667eea, #764ba2);
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
    }

    .box {
        background: white;
        padding: 30px;
        width: 350px;
        border-radius: 15px;
        box-shadow: 0 15px 40px rgba(0,0,0,0.2);
    }

    h2 {
        text-align: center;
        margin-bottom: 25px;
    }

    input {
        width: 100%;
        padding: 12px;
        margin: 10px 0;
        border: 1px solid #ddd;
        border-radius: 8px;
        font-size: 15px;
    }

    button {
        width: 100%;
        padding: 12px;
        margin-top: 15px;
        background: #4f46e5;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        cursor: pointer;
    }

    button:hover {
        background: #3730a3;
    }

    .demo {
        margin-top: 20px;
        padding: 12px;
        background: #f5f5f5;
        border-radius: 8px;
        text-align: center;
        font-size: 14px;
    }
</style>
</head>
<body>
    <div class="box">
        <h2>📝 Blog Login</h2>

<input
    type="text"
    id="username"
    placeholder="Enter Username"
>

<input
    type="password"
    id="password"
    placeholder="Enter Password"
>

<button type="button" onclick="login()">
    Login
</button>

<div class="demo">
    <b>Demo Login</b><br><br>
    Username: Ritesh<br>
    Password: 9931
</div>
</div>
<script>
function login() {

    let user = document.getElementById("username").value.trim();
    let pass = document.getElementById("password").value.trim();

    if (user === "Ritesh" && pass === "9931") {

        window.location.href = "home.html";

    } else {

        alert("Invalid Username or Password!");

    }
}
</script>
</body>
</html>
